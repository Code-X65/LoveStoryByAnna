<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extract Colors</title>
</head>
<body>
    <img id="logo" src="./logo_temp.png" style="display:none;" onload="extractColors()">
    <div id="results">Processing...</div>
    <ul id="color-list"></ul>

    <script>
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function colorDistance(c1, c2) {
            return Math.sqrt(
                Math.pow(c1.r - c2.r, 2) +
                Math.pow(c1.g - c2.g, 2) +
                Math.pow(c1.b - c2.b, 2)
            );
        }

        function extractColors() {
            const img = document.getElementById('logo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0, img.width, img.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const colorCounts = {};

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a < 128) continue; // Skip transparent

                // Quantize simply to grouping (round to nearest 10)
                const qr = Math.round(r / 10) * 10;
                const qg = Math.round(g / 10) * 10;
                const qb = Math.round(b / 10) * 10;

                const key = `${qr},${qg},${qb}`;
                if (!colorCounts[key]) {
                    colorCounts[key] = { r: qr, g: qg, b: qb, count: 0 };
                }
                colorCounts[key].count++;
            }

            // Convert to array and sort
            let colors = Object.values(colorCounts).sort((a, b) => b.count - a.count);

            // Filter similar colors
            const distinctColors = [];
            for (const color of colors) {
                let isDistinct = true;
                for (const existing of distinctColors) {
                    if (colorDistance(color, existing) < 50) { // Threshold for similarity
                        isDistinct = false;
                        break;
                    }
                }
                if (isDistinct) {
                    distinctColors.push(color);
                }
                if (distinctColors.length >= 8) break; 
            }

            const list = document.getElementById('color-list');
            list.innerHTML = '';
            distinctColors.forEach(c => {
                const hex = rgbToHex(c.r, c.g, c.b);
                const li = document.createElement('li');
                li.textContent = hex;
                li.style.backgroundColor = hex;
                li.style.color = (c.r*0.299 + c.g*0.587 + c.b*0.114) > 186 ? 'black' : 'white';
                list.appendChild(li);
            });
            document.getElementById('results').textContent = "Done";
        }
    </script>
</body>
</html>
